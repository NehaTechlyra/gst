{% load widget_tweaks %}
<form id="vendorCreateForm" method="POST" action="/Items/add_vendor/">
  {% csrf_token %}
  <div class="mb-3">
    {% for field in vendor_form %}
      <div class="col-md-12 mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">
          {{ field.label }}
          {% if field.field.required %}
            <span class="required-asterisk" style="color:#dc3545 !important;">*</span>
          {% endif %}
        </label>
        {{ field|add_class:"form-control" }}
        {% for error in field.errors %}
          <div class="mb-3 text-danger small"><span class="text-danger">*</span>{{ error }}</div>
        {% endfor %}
      </div>
    {% endfor %}
  </div>
  <div id="formErrors" class="text-danger"></div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">Add Vendor</button>
  </div>
</form>
