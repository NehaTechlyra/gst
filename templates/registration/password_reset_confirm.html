<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Lyra ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif !important; }
        body { font-family: 'Poppins', sans-serif !important; background-color: #f5f6fa; overflow: auto; min-height: 100vh; display: flex; align-items: center; padding: 40px 20px; }
        .container { margin: 0 auto; padding: 0; max-width: 1000px !important; width: 100%; }
        .account-content { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; display: flex; min-height: 500px; }
        .left-section { flex: 0 0 40%; background: #55588b; padding: 60px 40px; display: flex; flex-direction: column; justify-content: center; color: white; }
        .logo-container { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .logo-icon { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: 700; }
        .logo-text { font-size: 32px; font-weight: 600; color: white; letter-spacing: -0.5px; }
        .left-section h1 { font-size: 28px; font-weight: 600; margin-bottom: 16px; line-height: 1.3; }
        .left-section p { font-size: 14px; opacity: 0.9; line-height: 1.6; }
        .right-section { flex: 1; padding: 40px 50px; display: flex; flex-direction: column; justify-content: center; }
        .icon-wrap { width: 72px; height: 72px; background: #dce2f9; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
        .icon-wrap i { font-size: 32px; color: #55588b; }
        .form-header { margin-bottom: 28px; }
        .form-header h2 { font-size: 22px; font-weight: 600; color: #55588b; margin: 0 0 8px 0; }
        .form-header p { font-size: 13px; color: #7d7cad; margin: 0; line-height: 1.6; }
        .form-label { font-weight: 400; color: #55588b; margin-bottom: 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .form-label i { font-size: 14px; color: #7d7cad; }
        .form-control { border-radius: 5px; border: 1px solid #dde0f2; padding: 10px 12px; font-size: 14px; background: white; transition: all 0.2s; }
        .form-control:focus { border-color: #55588b; box-shadow: 0 0 0 3px rgba(85,88,139,0.1); outline: none; }
        .is-invalid { border-color: #e74c3c !important; background-color: #ffe6e6 !important; }
        .is-valid { border-color: #198754 !important; background-color: #e8f5e9 !important; background-image: none !important; box-shadow: none !important; padding-right: 40px !important; padding-left: 12px !important; }
        .invalid-feedback { font-size: 12px; margin-top: 4px; color: #e74c3c; display: none; }
        .is-invalid ~ .invalid-feedback { display: block; }
        .mb-3 { margin-bottom: 20px; }
        .password-input-wrapper { position: relative; }
        .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #7d7cad; cursor: pointer; padding: 4px; font-size: 16px; z-index: 10; }
        .password-input-wrapper .form-control.is-valid ~ .password-toggle { right: 12px !important; left: auto !important; }
        .password-toggle:hover { color: #55588b; }
        .strength-bar-wrap { margin-top: 8px; display: none; }
        .strength-bar-wrap.visible { display: block; }
        .strength-track { height: 4px; background: #dde0f2; border-radius: 99px; overflow: hidden; margin-bottom: 4px; }
        .strength-fill { height: 100%; border-radius: 99px; width: 0%; transition: width 0.3s, background 0.3s; }
        .strength-label { font-size: 11px; color: #7d7cad; }
        .match-indicator { font-size: 12px; margin-top: 5px; display: none; }
        .match-indicator.visible { display: block; }
        .match-indicator.match { color: #198754; }
        .match-indicator.nomatch { color: #e74c3c; }
        .commmombtn { background: #55588b; border: 1px solid #55588b; color: white; border-radius: 5px; padding: 12px 24px; cursor: pointer; transition: background 0.2s; font-size: 14px; font-weight: 500; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .commmombtn:hover { background: #44456e; border-color: #44456e; color: white; }
        .commmombtn:disabled { background: #dde0f2; border-color: #dde0f2; color: #7d7cad; cursor: not-allowed; }
        .text-center-section { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #dde0f2; }
        .text-center-section p { font-size: 13px; color: #7d7cad; margin: 0; }
        .text-center-section a { color: #667eea; text-decoration: none; font-weight: 500; }
        .text-center-section a:hover { text-decoration: underline; }

        /* ── Toast ── */
        .toast {
            visibility: hidden;
            min-width: 250px;
            max-width: 600px;
            width: auto;
            background-color: #198754;
            color: white;
            text-align: center;
            border-radius: 5px;
            padding: 16px 24px;
            position: fixed;
            z-index: 20000;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
            transition: opacity 0.5s linear;
            opacity: 0;
        }
        .toast.show { visibility: visible; opacity: 1; }

        @media (max-width: 992px) { .account-content { flex-direction: column; } .left-section { flex: none; padding: 40px 30px; } .right-section { padding: 30px; } .left-section h1 { font-size: 24px; } }
        @media (max-width: 576px) { .container { max-width: 100% !important; } .left-section, .right-section { padding: 20px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="account-content">

        <div class="left-section">
            <div class="logo-container">
                <div class="logo-icon">L</div>
                <div class="logo-text">Lyra ERP</div>
            </div>
            <h1>Set a new password</h1>
            <p>Choose a strong password to keep your Lyra ERP account secure.</p>
        </div>

        <div class="right-section">

            <div class="icon-wrap">
                <i class="bi bi-key"></i>
            </div>

            <div class="form-header">
                <h2>Set a New Password</h2>
                <p>Enter and confirm your new password below.</p>
            </div>

            <form method="post" id="resetForm">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label" for="new_password1">
                        <i class="bi bi-lock"></i>
                        New Password
                    </label>
                    <div class="password-input-wrapper">
                        <input id="new_password1" name="new_password1" type="password" class="form-control" placeholder="Enter new password" required />
                        <button type="button" class="password-toggle" data-target="new_password1">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="strength-bar-wrap" id="strengthWrap">
                        <div class="strength-track">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-label" id="strengthLabel">Password strength</div>
                    </div>
                    <div class="invalid-feedback">Please enter a password.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="new_password2">
                        <i class="bi bi-lock-fill"></i>
                        Confirm Password
                    </label>
                    <div class="password-input-wrapper">
                        <input id="new_password2" name="new_password2" type="password" class="form-control" placeholder="Confirm new password" required />
                        <button type="button" class="password-toggle" data-target="new_password2">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="match-indicator" id="matchIndicator"></div>
                    <div class="invalid-feedback">Passwords do not match.</div>
                </div>

                <button type="submit" class="commmombtn" id="saveBtn">
                    <i class="bi bi-check-lg"></i>
                    <span id="btnText">Save Password</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm" style="display:none;"></span>
                </button>
            </form>

            <div class="text-center-section">
                <p>Remembered your password? <a href="/login/">Back to Login</a></p>
            </div>

        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    function showToast(message, bgColor) {
        bgColor = bgColor || '#198754';
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.backgroundColor = bgColor;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Toggle password visibility
    document.querySelectorAll('.password-toggle').forEach(btn => {
        btn.addEventListener('click', function () {
            const input = document.getElementById(this.dataset.target);
            const icon  = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });
    });

    // Password strength
    const p1 = document.getElementById('new_password1');
    const strengthWrap  = document.getElementById('strengthWrap');
    const strengthFill  = document.getElementById('strengthFill');
    const strengthLabel = document.getElementById('strengthLabel');

    p1.addEventListener('input', function () {
        const val = this.value;
        if (!val) { strengthWrap.classList.remove('visible'); return; }
        strengthWrap.classList.add('visible');

        let score = 0;
        if (val.length >= 8)           score++;
        if (/[A-Z]/.test(val))         score++;
        if (/[0-9]/.test(val))         score++;
        if (/[^A-Za-z0-9]/.test(val))  score++;

        const levels = [
            { pct: '25%', color: '#e74c3c', label: 'Weak' },
            { pct: '50%', color: '#f39c12', label: 'Fair' },
            { pct: '75%', color: '#3498db', label: 'Good' },
            { pct: '100%', color: '#2ecc71', label: 'Strong' },
        ];
        const lvl = levels[score - 1] || levels[0];
        strengthFill.style.width      = lvl.pct;
        strengthFill.style.background = lvl.color;
        strengthLabel.textContent     = lvl.label;
        strengthLabel.style.color     = lvl.color;

        checkMatch();
    });

    // Password match
    const p2 = document.getElementById('new_password2');
    const matchIndicator = document.getElementById('matchIndicator');

    function checkMatch() {
        if (!p2.value) { matchIndicator.classList.remove('visible'); return; }
        matchIndicator.classList.add('visible');
        if (p1.value === p2.value) {
            matchIndicator.textContent = '✓ Passwords match';
            matchIndicator.className   = 'match-indicator visible match';
            p2.classList.remove('is-invalid');
            p2.classList.add('is-valid');
        } else {
            matchIndicator.textContent = '✗ Passwords do not match';
            matchIndicator.className   = 'match-indicator visible nomatch';
            p2.classList.remove('is-valid');
            p2.classList.add('is-invalid');
        }
    }

    p2.addEventListener('input', checkMatch);

    // Form submit
    document.getElementById('resetForm').addEventListener('submit', function (e) {
        e.preventDefault();

        // Validation
        if (!p1.value) {
            showToast('Please enter a new password.', '#e74c3c');
            p1.classList.add('is-invalid');
            return;
        }
        if (p1.value !== p2.value) {
            showToast('Passwords do not match. Please try again.', '#e74c3c');
            p2.classList.add('is-invalid');
            return;
        }

        // Show loading state
        const saveBtn   = document.getElementById('saveBtn');
        const btnText   = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        btnText.style.display   = 'none';
        btnSpinner.style.display = 'inline-block';
        saveBtn.disabled = true;

        // Submit via fetch so we can show toast before redirect
        const formData = new FormData(this);
        const csrfToken = formData.get('csrfmiddlewaretoken');

        fetch(window.location.href, {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': csrfToken, 'X-Requested-With': 'XMLHttpRequest' },
        })
        .then(res => res.json())
        .then(data => {
            btnText.style.display   = 'inline';
            btnSpinner.style.display = 'none';
            saveBtn.disabled = false;

            if (data.success) {
                showToast('Password saved successfully!', '#198754');
                setTimeout(() => { window.location.href = data.redirect_url || '/login/'; }, 1500);
            } else {
                showToast(data.message || 'Something went wrong. Please try again.', '#e74c3c');
            }
        })
        .catch(() => {
            // Fallback: if view doesn't return JSON, do a normal form POST
            // and let Django messages show on next page
            btnText.style.display   = 'inline';
            btnSpinner.style.display = 'none';
            saveBtn.disabled = false;
            showToast('Password saved successfully!', '#198754');
            setTimeout(() => this.submit(), 1200);
        });
    });

    // Show Django messages as toasts on page load
    {% if messages %}
        {% for message in messages %}
            {% if message.tags == 'success' %}
                window.addEventListener('DOMContentLoaded', () => showToast("{{ message|escapejs }}", '#198754'));
            {% elif message.tags == 'error' %}
                window.addEventListener('DOMContentLoaded', () => showToast("{{ message|escapejs }}", '#e74c3c'));
            {% else %}
                window.addEventListener('DOMContentLoaded', () => showToast("{{ message|escapejs }}", '#55588b'));
            {% endif %}
        {% endfor %}
    {% endif %}
</script>

</body>
</html>
