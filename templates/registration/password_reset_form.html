<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Lyra ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif !important;
        }

        body {
            font-family: 'Poppins', sans-serif !important;
            background-color: #f5f6fa;
            overflow: auto;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            margin: 0 auto;
            padding: 0;
            max-width: 1000px !important;
            width: 100%;
        }

        .account-content {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            min-height: 500px;
        }

        /* ── Left panel ── */
        .left-section {
            flex: 0 0 40%;
            background: #55588b;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 600;
            color: white;
            letter-spacing: -0.5px;
        }

        .left-section h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .left-section p {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.6;
        }

        /* ── Right panel ── */
        .right-section {
            flex: 1;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* ── Icon ── */
        .icon-wrap {
            width: 72px;
            height: 72px;
            background: #dce2f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .icon-wrap i {
            font-size: 32px;
            color: #55588b;
        }

        /* ── Header ── */
        .form-header {
            margin-bottom: 28px;
        }

        .form-header h2 {
            font-size: 22px;
            font-weight: 600;
            color: #55588b;
            margin: 0 0 8px 0;
        }

        .form-header p {
            font-size: 13px;
            color: #7d7cad;
            margin: 0;
            line-height: 1.6;
        }

        /* ── Form ── */
        .form-label {
            font-weight: 400;
            color: #55588b;
            margin-bottom: 6px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-label i {
            font-size: 14px;
            color: #7d7cad;
        }

        .form-control {
            border-radius: 5px;
            border: 1px solid #dde0f2;
            padding: 10px 12px;
            font-size: 14px;
            background: white;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #55588b;
            box-shadow: 0 0 0 3px rgba(85,88,139,0.1);
            outline: none;
        }

        .mb-3 {
            margin-bottom: 20px;
        }

        /* ── Button ── */
        .commmombtn {
            background: #55588b;
            border: 1px solid #55588b;
            color: white;
            border-radius: 5px;
            padding: 12px 24px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .commmombtn:hover {
            background: #44456e;
            border-color: #44456e;
            color: white;
        }

        /* ── Footer link ── */
        .text-center-section {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #dde0f2;
        }

        .text-center-section p {
            font-size: 13px;
            color: #7d7cad;
            margin: 0;
        }

        .text-center-section a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .text-center-section a:hover {
            text-decoration: underline;
        }

        /* ── Toast ── */
        .toast {
            visibility: hidden;
            min-width: 250px;
            max-width: 600px;
            width: auto;
            background-color: #198754;
            color: white;
            text-align: center;
            border-radius: 5px;
            padding: 16px 24px;
            position: fixed;
            z-index: 20000;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
            transition: opacity 0.5s linear;
            opacity: 0;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
        }

        /* ── Responsive ── */
        @media (max-width: 992px) {
            .account-content { flex-direction: column; }
            .left-section { flex: none; padding: 40px 30px; }
            .right-section { padding: 30px; }
            .left-section h1 { font-size: 24px; }
        }

        @media (max-width: 576px) {
            .container { max-width: 100% !important; }
            .left-section, .right-section { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="account-content">

        <!-- Left panel -->
        <div class="left-section">
            <div class="logo-container">
                <div class="logo-icon">L</div>
                <div class="logo-text">Lyra ERP</div>
            </div>
            <h1>Reset your password</h1>
            <p>Enter your email or username and we'll send you a link to get back into your account.</p>
        </div>

        <!-- Right panel -->
        <div class="right-section">

            <div class="icon-wrap">
                <i class="bi bi-shield-lock"></i>
            </div>

            <div class="form-header">
                <h2>Password Reset</h2>
                <p>Enter your email address or username below and we'll send you a password reset link.</p>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label" for="email">
                        <i class="bi bi-envelope"></i>
                        Email or Username
                    </label>
                    <input
                        id="email"
                        name="email"
                        type="text"
                        class="form-control"
                        placeholder="Enter your email or username"
                        required
                    />
                </div>

                <button type="submit" class="commmombtn">
                    <i class="bi bi-send"></i>
                    Send Reset Link
                </button>
            </form>

            <div class="text-center-section">
                <p>Remembered your password? <a href="/login/">Back to Login</a></p>
            </div>

        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    function showToast(message, bgColor) {
        bgColor = bgColor || '#198754';
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.backgroundColor = bgColor;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    document.querySelector('form').addEventListener('submit', function(e) {
        const emailVal = document.getElementById('email').value.trim();
        if (!emailVal) {
            e.preventDefault();
            showToast('Please enter your email or username.', '#e74c3c');
            return;
        }
        // Show sending toast; form will submit normally (Django handles redirect)
        showToast('Sending reset link…', '#55588b');
    });

    // Show Django messages as toasts if present
    {% if messages %}
        {% for message in messages %}
            {% if message.tags == 'success' %}
                window.addEventListener('DOMContentLoaded', () => showToast("{{ message|escapejs }}", '#198754'));
            {% elif message.tags == 'error' %}
                window.addEventListener('DOMContentLoaded', () => showToast("{{ message|escapejs }}", '#e74c3c'));
            {% else %}
                window.addEventListener('DOMContentLoaded', () => showToast("{{ message|escapejs }}", '#55588b'));
            {% endif %}
        {% endfor %}
    {% endif %}
</script>

</body>
</html>
