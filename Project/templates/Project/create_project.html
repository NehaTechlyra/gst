<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Project Form Add</h1>

    <form action="" method="post">
        {% csrf_token %}

        {{form}}

        <input type="submit" name="Save" value="Submit">
    </form>
</body>
</html>

<!-- Navigation confirmation modal -->
<div class="modal fade" id="unsavedChangesModal" tabindex="-1" aria-labelledby="unsavedChangesLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="unsavedChangesLabel">Unsaved Changes</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        You have unsaved changes. Do you want to leave without saving?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="confirmNavigation" class="btn btn-primary">Leave</button>
      </div>
    </div>
  </div>
</div>

<script>
    // Track form changes - Global variable
    let formChanged = false;
    const form = document.querySelector('form');

    if (form) {
        form.addEventListener('change', () => { formChanged = true; });
        form.addEventListener('input', () => { formChanged = true; });
    }
    
    // Track Select2 changes using jQuery delegation (works regardless of initialization timing)
    if (window.$ && window.jQuery) {
        $(document).on('change', 'select.select2, .select2-hidden-accessible', function() {
            formChanged = true;
            console.log('Form changed via Select2 change event (delegation)');
        });
    }
    
    // Direct select element change listeners as fallback
    document.addEventListener('change', function(e) {
        if (e.target.tagName === 'SELECT') {
            formChanged = true;
            console.log('Form changed via direct select change event');
        }
    }, true);

    // Global click interceptor for all links
    document.addEventListener('click', function(e) {
        let link = e.target.closest('a');
        if (link && formChanged) {
            const href = link.getAttribute('href');
            if (href && !href.startsWith('#') && !link.getAttribute('data-bs-toggle') && !href.startsWith('javascript:')) {
                e.preventDefault();
                e.stopPropagation();
                
                const modal = new bootstrap.Modal(document.getElementById('unsavedChangesModal'));
                const confirmBtn = document.getElementById('confirmNavigation');
                
                // Remove previous click handlers
                const newConfirmBtn = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
                
                // Add new click handler
                newConfirmBtn.addEventListener('click', () => {
                    formChanged = false;
                    window.location.href = href;
                });
                
                modal.show();
            }
        }
    }, true);
</script>
