<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lyra CRM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 16.666667%;
            /* use same light sidebar palette as main site */
            background: -webkit-linear-gradient(to right, #f2f4fc, #f2f4fc);
            background: linear-gradient(to right, #f2f4fc, #f2f4fc);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1000;
            border-right: 1px solid rgba(0,0,0,0.04);
        }
        .sidebar a {
            color: #55588b; /* dark blue/grey like main app */
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }
        .sidebar a:hover {
            background: #dce2f9; /* light highlight */
            color: #2b2f4a;
        }
        .sidebar .active {
            background: #dce2f9; /* match active style */
            color: #2b2f4a;
        }
        /* modern stat cards */
        .stat-card {
            --accent: #3498db;
            border-left: 6px solid var(--accent);
        }
        .stat-card.success { --accent: #27ae60; }
        .stat-card.warning { --accent: #f39c12; }
        .stat-card.danger { --accent: #e74c3c; }

        /* CRM modern card base */
        .crm-card {
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(20,20,40,0.04);
            overflow: hidden;
            transition: transform .15s ease, box-shadow .15s ease;
            background: #fff;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .crm-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 24px rgba(20,20,40,0.08);
        }
        .crm-card .card-body {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.1rem;
        }
        .crm-card .icon {
            width: 54px;
            height: 54px;
            border-radius: 8px;
            background: rgba(0,0,0,0.03);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size: 22px;
            color: var(--accent);
            flex-shrink: 0;
        }
        .crm-card .meta { color: #6b7280; font-size: 0.95rem; margin-bottom: 0.25rem; }
        .crm-card .value { font-weight: 600; font-size: 1.6rem; }
        .main-content {
            margin-left: 16.666667%;
            width: 83.333333%;
            max-width: 83.333333%;
            overflow-x: hidden;
        }
        .container-fluid {
            padding-left: 0;
            padding-right: 0;
            max-width: 100%;
            overflow-x: hidden;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body data-base-currency-symbol="{{ company_base_currency_symbol|default:'₹' }}">
    <div class="container-fluid">
        <div class="row">
            <nav class="sidebar">
                <h4 class="p-3" style="color:#55588b;">Lyra CRM</h4>
                <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="{% url 'lead_list' %}" class="{% if 'lead' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-person-plus"></i> Leads
                </a>
                <a href="{% url 'opportunity_list' %}" class="{% if 'opportunity' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-briefcase"></i> Opportunities
                </a>
                <a href="{% url 'quotation_list' %}" class="{% if 'quotation' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-file-text"></i> Quotations
                </a>
                <a href="{% url 'followup_list' %}" class="{% if 'followup' in request.resolver_match.url_name %}active{% endif %}">
                    <i class="bi bi-calendar-check"></i> Follow-ups
                </a>
                <a href="{% url 'lost_reason_create' %}">
                    <i class="bi bi-x-circle"></i> Add Lost Reason
                </a>
                <a href="/admin/">
                    <i class="bi bi-gear"></i> Admin
                </a>
            </nav>
            <main class="main-content p-4">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script>
        window.BASE_CURRENCY_SYMBOL = "{{ company_base_currency_symbol|default:'₹'|escapejs }}";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
