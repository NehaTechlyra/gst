{% extends 'website/index.html' %}

{% block page_title %}{% if obj %}Edit Bank{% else %}Add Bank{% endif %}{% endblock %}

{% block content %}
<div class="container mt-3">
  
  <form method="post">
    {% csrf_token %}
    {% if next %}
      <input type="hidden" name="next" value="{{ next }}" />
    {% endif %}
    <div class="mb-3">
      <label class="form-label">Bank name</label>
  <input name="bank_name" class="form-control" required value="{% if obj %}{{ obj.bank_name }}{% endif %}" />
    </div>
    {% comment %} <div class="mb-3">
      <label class="form-label">Account number</label>
      <input name="account_number" class="form-control" />
    </div> {% endcomment %}
    <div class="form-check mb-3">
  <input type="checkbox" name="status" class="form-check-input" id="id_status" {% if obj %}{% if obj.status %}checked{% endif %}{% else %}checked{% endif %} />
      <label class="form-check-label" for="id_status">Active</label>
    </div>
  <button class="btn btn-primary">{% if obj %}Update{% else %}Save{% endif %}</button>
  <a href="{% if next %}{% url 'admin_dashboard' %}#{{ next }}{% else %}{% url 'admin_dashboard' %}{% endif %}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
