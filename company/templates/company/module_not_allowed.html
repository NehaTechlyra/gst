<!-- templates/company/module_not_allowed.html -->
{% extends 'website/index.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <i class="bi bi-lock text-danger" style="font-size: 5rem;"></i>
                    </div>
                    
                    <h2 class="card-title mb-3">Module Access Denied</h2>
                    
                    <p class="text-muted mb-4">
                        This module is not enabled in your company's license. 
                        Please contact your administrator to enable access.
                    </p>
                    
                    <div class="mt-4">
                        <a href="/" class="btn btn-primary">
                            <i class="bi bi-house"></i> Go to Home
                        </a>
                        <a href="{% url 'logout' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-box-arrow-left"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
