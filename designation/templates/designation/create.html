{% extends 'website/index.html' %}

{% block page_title %}{% if obj %}Edit Designation{% else %}Add Designation{% endif %}{% endblock %}

{% block content %}
<div class="container mt-3">
  
  <form method="post">
    {% csrf_token %}
    {% if next %}
      <input type="hidden" name="next" value="{{ next }}" />
    {% endif %}
    <div class="mb-3">
      <label class="form-label">Department</label>
      <select name="departments" class="form-select" required>
        <option value="">Select department</option>
        {% for d in departments %}
        <option value="{{ d.id }}" {% if obj and obj.departments_id == d.id %}selected{% endif %}>{{ d.department_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Designation name</label>
  <input name="designation_name" class="form-control" required value="{% if obj %}{{ obj.designation_name }}{% endif %}" />
    </div>
    <div class="form-check mb-3">
      <input type="checkbox" name="status" class="form-check-input" id="id_status" checked />
      <label class="form-check-label" for="id_status">Active</label>
    </div>
  <button class="btn btn-primary">{% if obj %}Update{% else %}Save{% endif %}</button>
  <a href="{% if next %}{% url 'admin_dashboard' %}#{{ next }}{% else %}{% url 'admin_dashboard' %}{% endif %}" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
